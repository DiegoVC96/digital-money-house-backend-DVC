spring:
  datasource:
    url: jdbc:mysql://localhost:3309/auth_db
    username: dmh
    password: dmh_password

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  mail:
    host: localhost
    port: 1025
  application:
    name: auth-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.base-url}/realms/${keycloak.realm}

server:
  port: 8081

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

keycloak:
  base-url: http://localhost:8180
  realm: digital-money-house
  service-client-id: auth-service
  service-client-secret: ${KEYCLOAK_AUTH_SERVICE_SECRET}
  public-client-id: digital-money-house-web

verification:
  code-expiration-minutes: 10
  mail-from: no-reply@digitalmoneyhouse.local