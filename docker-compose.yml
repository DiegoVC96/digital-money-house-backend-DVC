services:
  mysql-users:
    image: mysql:8.4
    container_name: dmh-mysql-users
    environment:
      MYSQL_DATABASE: users_db
      MYSQL_USER: dmh
      MYSQL_PASSWORD: dmh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-users-data:/var/lib/mysql

  mysql-accounts:
    image: mysql:8.4
    container_name: dmh-mysql-accounts
    environment:
      MYSQL_DATABASE: accounts_db
      MYSQL_USER: dmh
      MYSQL_PASSWORD: dmh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - mysql-accounts-data:/var/lib/mysql

  mysql-auth:
    image: mysql:8.4
    container_name: dmh-mysql-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: dmh
      MYSQL_PASSWORD: dmh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dmh-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dmh-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

volumes:
  mysql-users-data:
  mysql-accounts-data:
  mysql-auth-data: