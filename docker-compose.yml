services:
  mysql-users:
    image: mysql:8.4
    container_name: dmh-mysql-users
    environment:
      MYSQL_DATABASE: users_db
      MYSQL_USER: dmh
      MYSQL_PASSWORD: dmh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-users-data:/var/lib/mysql

  mysql-accounts:
    image: mysql:8.4
    container_name: dmh-mysql-accounts
    environment:
      MYSQL_DATABASE: accounts_db
      MYSQL_USER: dmh
      MYSQL_PASSWORD: dmh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - mysql-accounts-data:/var/lib/mysql

  mysql-auth:
    image: mysql:8.4
    container_name: dmh-mysql-auth
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: dmh
      MYSQL_PASSWORD: dmh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dmh-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dmh-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:?Definir KEYCLOAK_ADMIN_USERNAME en .env}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Definir KEYCLOAK_ADMIN_PASSWORD en .env}"
      KEYCLOAK_AUTH_SERVICE_SECRET: "${KEYCLOAK_AUTH_SERVICE_SECRET:?Definir KEYCLOAK_AUTH_SERVICE_SECRET en .env}"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dmh-keycloak-bootstrap
    depends_on:
      - keycloak
    entrypoint: ["/bin/sh", "/opt/keycloak/bootstrap/init.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: digital-money-house
      KEYCLOAK_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:?Definir KEYCLOAK_ADMIN_USERNAME en .env}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Definir KEYCLOAK_ADMIN_PASSWORD en .env}"
      KEYCLOAK_AUTH_SERVICE_SECRET: "${KEYCLOAK_AUTH_SERVICE_SECRET:?Definir KEYCLOAK_AUTH_SERVICE_SECRET en .env}"
    volumes:
      - ./keycloak/bootstrap:/opt/keycloak/bootstrap:ro
    restart: "no"

volumes:
  mysql-users-data:
  mysql-accounts-data:
  mysql-auth-data: