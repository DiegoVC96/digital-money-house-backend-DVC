spring:
  application:
    name: users-service

  datasource:
    url: jdbc:mysql://localhost:3307/users_db
    username: dmh
    password: dmh_password

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/digital-money-house

server:
  port: 8082

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/